version: "3.8"
services:
  mysql:
    image: mysql:8.0              # MySQL 8 이미지 사용
    container_name: mysql-db-2
    environment:
      MYSQL_ROOT_PASSWORD: "0000"   # 루트 비밀번호
      MYSQL_DATABASE: "all4seoul"   # 원하면 초기 DB 생성
      TZ: "Asia/Seoul"              # 타임존 설정
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "3306:3306"                  # 호스트 3306 포트 → 컨테이너 3306
    volumes:
      - mysql_data:/var/lib/mysql    # 데이터 영속성

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
